<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>TaskFlow: Gestor de Tareas</title>
    <link
      rel="stylesheet"
      href="/Manipulaci-n-del-DOM-con-JavaScript/Fernandolopes/css/styles.css"
    />
  </head>
  <body>
    <h1>TaskFlow: Gestor de Tareas</h1>

    <!-- Formulario para agregar nuevas tareas -->
    <form id="formulario">
      <input type="text" id="tarea" placeholder="Agregar nueva tarea" required />
      <button type="submit">Agregar</button>
    </form>

    <!-- Lista donde se mostrarán las tareas -->
    <ul id="lista-tareas"></ul>

    <!-- Enlazamos el JavaScript -->
    <script src="app.js"></script>
  </body>
</html>
