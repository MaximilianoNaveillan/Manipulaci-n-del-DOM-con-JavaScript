<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow: Gestor de Tareas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="task-app">
        <h1 class="task-app__title">TaskFlow</h1>
        <form id="formulario" class="task-app__form">
            <input type="text" id="tarea" class="task-app__form-input" placeholder="Agregar nueva tarea" required>
            <button type="submit" class="task-app__form-button">Agregar</button>
        </form>
        <ul id="lista-tareas" class="task-list"></ul>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
