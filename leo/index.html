<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tareas</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="body">
    <!-- Header -->
    <header class="header">
      <nav>
        <button type="button" class="btnCrearTarea">Crear Tarea +</button>

        <div>
          <ul class="menu">
            <li>
              <a href="#">Todas</a>
            </li>
            <li>
              <a href="#">Pendientes</a>
            </li>
            <li>
              <a href="#">Completadas</a>
            </li>
          </ul>
        </div>
      </nav>
    </header>
    <!-- Main -->
    <main class="main">
      <h3>TAREAS</h3>
      <section class="container-cards"></section>

      <!-- MODAL-->
      <div class="modal-01">
        <div class="modal-01-container">
          <div class="modal-01-header">
            <h2 class="modal-title">Crear Tarea</h2>
            <button type="button" class="btnCerrarModal" onclick="cerrarModal01()">X</button>
          </div>
          <div class="modal-01-body">
            <form class="formTarea">
              <input type="text" placeholder="Tarea" class="input-01-tarea" />
              <button type="submit" class="btnSubmitTarea">Crear</button>
            </form>
          </div>
        </div>
      </div>
    </main>
    <!-- Footer -->
    <footer class="footer">
      <h2>footer</h2>
    </footer>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
