<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tareas</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="body">
    <!-- Header -->
    <header class="header">
      <nav>
        <button type="button" class="btnCrearTarea">Crear Tarea +</button>

        <div>
          <ul class="menu" id="menuTabs">
            <li>
              <a href="#" class="nav-item active" data-filter="todas">Todas</a>
            </li>
            <li>
              <a href="#" class="nav-item" data-filter="pendientes"
                >Pendientes</a
              >
            </li>
            <li>
              <a href="#" class="nav-item" data-filter="completadas"
                >Completadas</a
              >
            </li>

            <div class="tab-indicator"></div>
          </ul>
        </div>
      </nav>
    </header>
    <!-- Main -->
    <main class="main">
      <section class="container-cards"></section>
      <!-- MODAL CREAR TAREA-->
      <div class="modal-01">
        <div class="modal-01-container">
          <div class="modal-01-header">
            <h2 class="modal-title">Crear Tarea</h2>
            <button
              type="button"
              class="btnCerrarModal"
              onclick="cerrarModal01()"
            >
              X
            </button>
          </div>
          <div class="modal-01-body">
            <form class="formTarea">
              <input type="text" placeholder="Tarea" class="input-01-tarea" />
              <button type="submit" class="btnSubmitTarea">Crear</button>
            </form>
          </div>
        </div>
      </div>
    </main>

    <!-- MODAL EDITAR TAREA-->
    <div class="modal-02">
      <div class="modal-02-container">
        <div class="modal-02-header">
          <h2 class="modal-title">Editar Tarea</h2>
          <button
            type="button"
            class="btnCerrarModal02"
            onclick="cerrarModal02()"
          >
            X
          </button>
        </div>
        <div class="modal-02-body">
          <form class="formEditarTarea">
            <input type="text" placeholder="Tarea" class="input-02-tarea" />
            <button type="submit" class="btnSubmitEditarTarea">Editar</button>
          </form>
        </div>
      </div>
    </div>
    <!-- Footer -->
    <footer class="footer">
      <h4>Task Flow 2026 @ Todos los derechos reservados</h4>
    </footer>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
